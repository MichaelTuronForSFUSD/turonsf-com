    evidence:
      - { label_key: "src_instruction", source: "instruction" }
      - { label_key: "src_fiscal", source: "fiscal" }
  - id: "alida"
    name: "Alida Fisher"
    reason_key: "alida_reason"
    site: "https://www.alidafisher.com/"
    donate: "https://secure.actblue.com/donate/reelect-alida-fisher"
