# data/hub_links.yaml
# Outbound destinations for the v3 endorsement hub (home page, all languages).
# Copy lives in data/hub_copy.json. Candidate order is editorial only.
#
# Campaign and donate links were followed from each candidate's own site on
# 2026-10-04 (package audit) and rechecked 2026-10-14, when every claim in
# data/hub_copy.json was also checked against these sources. Keep them free of
# tracking parameters.

official:
  candidate: "https://www.sf.gov/candidates-november-3-2026-general-election"
  election: "https://www.sf.gov/november-3-2026-consolidated-general-election"
  voter_portal: "https://sfelections.gov/voterportal"
  # English only; 73 MB ZIP of MP3 chapters, linked from the election page.
  audio_guide: "https://api.sf.gov/documents/63945/N26_Audio_VIP.zip"

# Official voter guide (dated August 31) in each route's language. The city
# publishes English, Chinese (Traditional script), Spanish, Filipino, and
# Vietnamese; Arabic readers get the English guide.
voter_guides:
  en: "https://media.api.sf.gov/documents/N26_EN_VIP.pdf"
  es: "https://media.api.sf.gov/documents/N26_SP_VIP.pdf"
  yue-hant: "https://media.api.sf.gov/documents/N26_CH_VIP.pdf"
  zh-hant: "https://media.api.sf.gov/documents/N26_CH_VIP.pdf"
  zh-hans: "https://media.api.sf.gov/documents/N26_CH_VIP.pdf"
  tl: "https://media.api.sf.gov/documents/N26_FI_VIP.pdf"
  vi: "https://media.api.sf.gov/documents/N26_VI_VIP.pdf"
  ar: "https://media.api.sf.gov/documents/N26_EN_VIP.pdf"

sources:
  instruction: "https://missionlocal.org/2026/08/san-francisco-school-board-meet-the-candidates-math-english-targets/"
  fiscal: "https://missionlocal.org/2026/10/san-francisco-meet-the-candidates-school-board-california-fiscal-oversight/"
  retention: "https://missionlocal.org/2026/09/san-francisco-school-board-meet-the-candidates-teacher-retention/"
  assignment: "https://missionlocal.org/2026/08/san-francisco-school-board-meet-the-candidates-area-assignments/"
  closures: "https://missionlocal.org/2026/09/san-francisco-school-board-candidates-school-closures-2030/"
  forum: "https://missionlocal.org/2026/09/san-fransisco-sfusd-chinese-for-affirmative-action-school-board-forum/"
  michael_questionnaire: "https://sfparentaction.org/wp-content/uploads/Michael-J.-Turon-November-2026-Candidate-Questionnaire.pdf"

candidates:
  - id: "phil"
    name: "Phil Kim"
    reason_key: "phil_reason"
    site: "https://www.philkim.org/"
    donate: "https://secure.actblue.com/donate/philkim-nov26"
    questionnaire: "https://sfparentaction.org/wp-content/uploads/Phil-Kim-November-2026-Candidate-Questionnaire.pdf"
    evidence:
      - { label_key: "src_instruction", source: "instruction" }
      - { label_key: "src_fiscal", source: "fiscal" }
  - id: "alida"
    name: "Alida Fisher"
    reason_key: "alida_reason"
    site: "https://www.alidafisher.com/"
    donate: "https://secure.actblue.com/donate/reelect-alida-fisher"
    questionnaire: "https://sfparentaction.org/wp-content/uploads/Alida-Fisher-November-2026-Candidate-Questionnaire.pdf"
    guide_page: { en: 31, translated: 23 }
    evidence:
      - { label_key: "src_pamphlet", statement: true, named: true }
      - { label_key: "src_retention", source: "retention", named: true }
  - id: "ryan"
    name: "Ryan Hazelton"
    reason_key: "ryan_reason"
    site: "https://www.ryanforsfschools.com/"
    donate: "https://secure.actblue.com/donate/ryanhazelton"
    questionnaire: "https://sfparentaction.org/wp-content/uploads/Ryan-Hazelton-November-2026-Candidate-Questionnaire.pdf"
    guide_page: { en: 31, translated: 24 }
    evidence:
      - { label_key: "src_pamphlet", statement: true, named: true }
      - { label_key: "src_retention", source: "retention", named: true }

# Date the page facts were last verified. Keep in step with the "updated"
# line in data/hub_copy.json; it feeds dateModified in the structured data.
updated: "2026-10-14"
