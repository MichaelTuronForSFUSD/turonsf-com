# data/hub_links.yaml
# Outbound destinations for the v3 endorsement hub (home page, all languages).
# Copy lives in data/hub_copy.json (generated from the October 4 redesign
# package, 09-localized-copy.json). Candidate order is editorial only.
#
# Campaign and donate links were followed from each candidate's own site on
# 2026-10-04 (package audit) and rechecked 2026-10-14. Keep them free of
# tracking parameters.

official:
