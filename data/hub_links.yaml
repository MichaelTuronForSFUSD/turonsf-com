  election: "https://www.sf.gov/november-3-2026-consolidated-general-election"
  voter_portal: "https://sfelections.gov/voterportal"
  voter_guide: "https://media.api.sf.gov/documents/N26_EN_VIP.pdf"
  accessible_guide: "https://sfelections.gov/vip"

sources:
  instruction: "https://missionlocal.org/2026/08/san-francisco-school-board-meet-the-candidates-math-english-targets/"
  fiscal: "https://missionlocal.org/2026/10/san-francisco-meet-the-candidates-school-board-california-fiscal-oversight/"
  retention: "https://missionlocal.org/2026/09/san-francisco-school-board-meet-the-candidates-teacher-retention/"
  assignment: "https://missionlocal.org/2026/08/san-francisco-school-board-meet-the-candidates-area-assignments/"
  closures: "https://missionlocal.org/2026/09/san-francisco-school-board-candidates-school-closures-2030/"
