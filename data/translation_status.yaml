# data/translation_status.yaml
# Per-page per-language translation status table.
# Architecture Decisions 1, 2, 4, 9.
#
# This is the SINGLE source of truth that drives:
#   - hreflang inclusion/exclusion (themes/.../head-hreflang.html)
#   - language switcher routing fallback (themes/.../language-switcher.html)
#   - sitemap.xml live-page selection (layouts/sitemap.xml)
#   - AI translation disclosure rendering vs translation-pending notice
#     (themes/.../ai-translation-disclosure.html)
#
# Key format: "{page-relpath}::{lang}". Page relpath uses trailing slash and
# starts with "/". Example: "/about/::es". The English row is the implicit
# canonical and is always treated as live by the templates.
#
# Status values (Architecture Decision 9 §4):
#   placeholder         scaffold exists; not translated; renders pending notice
#   ai_translated       AI draft applied; pre-review; can publish for preview
#   reviewed            operator + Sam Ray + Lauren review complete
#   community_corrected updated after public correction from info@turonsf.com
#   live                public production state
#
# v1.3.0 ships with every non-English entry at `placeholder`. The operator's
# AI translation workflow (Phase1_Translation_Workflow.md) progresses each
# entry through ai_translated -> reviewed -> live as each page completes.

pages:

