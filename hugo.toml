baseURL = "https://turonsf.com/"
title = "Michael J. Turon"
theme = "turon-civic"
enableRobotsTXT = true
enableGitInfo = true
timeout = "60s"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term"]
summaryLength = 32

[params]
  og_image = "/img/og-endorsements.png"
  description = "A personal statement by Michael J. Turon about his 2026 school board campaign decision and three endorsements."
  candidate = "Michael Turon"
  role_tag = "Data Scientist · SFUSD Parent"
  election_date = "November 3, 2026"
  email = "info@turonsf.com"
  fppc_id = "1482971"
  treasurer = "Lauren Turon"
  calendar_url = "https://calendar.app.google/kuDZVx7TyBLKx3B87"
  umami_website_id = "ee906f2b-15f0-4856-afca-1134c0bdaebf"
  # v3 hub: when true, candidate site/donate links send an aggregate Umami
  # "candidate_cta" event (source "<candidate>-<site|donate>"). Off until the
  # owner approves and discloses outbound-click counting.
  track_candidate_clicks = false

[params.cta_destinations]
  email      = "mailto:info@turonsf.com"

[languages]

  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 1
    title = "Michael J. Turon"
    [languages.en.params]
      og_locale = "en_US"
      languageName = "English"
      dir = "ltr"
      bcp47 = "en"

  [languages.es]
    languageCode = "es"
    languageName = "Español"
    weight = 2
    title = "Michael J. Turon"
    [languages.es.params]
      og_locale = "es_US"
      languageName = "Español"
      dir = "ltr"
      bcp47 = "es"

  [languages.zh-Hant]
    languageCode = "zh-Hant"
    languageName = "繁體中文"
    weight = 4
    title = "Michael J. Turon"
    [languages.zh-Hant.params]
      og_locale = "zh_TW"
      languageName = "繁體中文"
      dir = "ltr"
      bcp47 = "zh-Hant"

  [languages.yue-Hant]
    languageCode = "yue-Hant"
    languageName = "廣東話"
    weight = 3
    title = "Michael J. Turon"
    [languages.yue-Hant.params]
      og_locale = "zh_HK"
      # Google hreflang needs an ISO 639-1 code; "yue" is not one. The page
      # lang attribute stays yue-Hant.
      hreflang = "zh-HK"
      languageName = "廣東話"
      dir = "ltr"
      bcp47 = "yue-Hant"

  [languages.zh-Hans]
    languageCode = "zh-Hans"
    languageName = "简体中文"
    weight = 5
    title = "Michael J. Turon"
    [languages.zh-Hans.params]
      og_locale = "zh_CN"
      languageName = "简体中文"
      dir = "ltr"
      bcp47 = "zh-Hans"

  [languages.tl]
    languageCode = "tl"
    locale = "fil"
    languageName = "Tagalog"
    weight = 6
    title = "Michael J. Turon"
    [languages.tl.params]
      og_locale = "tl_PH"
      languageName = "Tagalog"
      dir = "ltr"
      bcp47 = "tl"

  [languages.vi]
    languageCode = "vi"
    languageName = "Tiếng Việt"
    weight = 7
    title = "Michael J. Turon"
    [languages.vi.params]
      og_locale = "vi_VN"
      languageName = "Tiếng Việt"
      dir = "ltr"
      bcp47 = "vi"

  [languages.ar]
    languageCode = "ar"
    languageName = "العربية"
    weight = 8
    title = "Michael J. Turon"
    [languages.ar.params]
      og_locale = "ar_AR"
      languageName = "العربية"
      dir = "rtl"
      bcp47 = "ar"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "llms"]
  section = ["HTML"]
  page = ["HTML"]
